<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voice bridge">
<title>Voice bridge</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --line: #e4e4e0; --text: #1b1c1e; --muted: #6b6d72;
    --accent: #2f6fde; --accent-text: #fff; --warn: #c7780a; --bad: #c9372c; --good: #1f8a4c;
    --q-bg: #fff6e6; --q-line: #f0c777; --sel: #2f6fde;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1b1d20; --line: #2c2f33; --text: #ececee; --muted: #9a9ca3;
      --accent: #4f8cf0; --q-bg: #2a2216; --q-line: #7a5a20; --sel: #4f8cf0;
    }
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
  }
  button, input, select { font: inherit; color: inherit; }
  input, select { font-size: 16px; }
  button {
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; cursor: pointer; border: 0;
    transition: transform 100ms ease-out, background 100ms, opacity 100ms;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .45; cursor: default; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--good); }
  .icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .icon-btn.off { color: var(--muted); }

  main { padding: 12px 16px calc(210px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 4px 8px; font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; padding: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 8px;
  }
  .card.sel { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
  .q { background: var(--q-bg); border-color: var(--q-line); width: 100%; text-align: left; display: block; }
  .q .who { font-size: 13px; color: var(--muted); }
  .q .text { font-size: 17px; margin-top: 2px; overflow-wrap: anywhere; }

  .s-top { display: flex; align-items: center; gap: 8px; }
  .s-label { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; padding: 0; text-align: left; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); flex: none; }
  .chip.working { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .chip.waiting, .chip.needs_terminal { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .chip.idle { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .s-last { color: var(--muted); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .s-meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  .s-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill { background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
  .pill.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .ended { opacity: .55; }

  .feed .m { padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 15px; overflow-wrap: anywhere; }
  .feed .m .who { color: var(--muted); font-size: 12px; }
  .feed .m.answer, .feed .m.instruction { color: var(--accent); }
  .feed .m.system { color: var(--muted); font-size: 14px; }
  .feed .m.question { font-weight: 600; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 640px; margin: 0 auto; }
  .target { font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card);
    border-radius: 12px; padding: 10px 12px;
  }
  .send { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 0 16px; font-weight: 600; }
  .talk {
    margin-top: 8px; width: 100%; height: 72px; border-radius: 18px;
    background: var(--accent); color: var(--accent-text); font-size: 19px; font-weight: 600;
    touch-action: none;
  }
  .talk.rec { background: var(--bad); transform: scale(0.98); }
  .bar-small { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); gap: 8px; }
  .bar-small label { display: flex; align-items: center; gap: 6px; }
  .bar-small select { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px; }

  .toast {
    position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 14px;
    z-index: 20; opacity: 0; pointer-events: none; transition: opacity 150ms; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--bad); color: #fff; }

  .unlock {
    position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
  }
  .unlock button { background: var(--accent); color: var(--accent-text); border-radius: 16px; padding: 16px 28px; font-size: 18px; font-weight: 600; }
  .unlock p { color: var(--muted); max-width: 320px; margin: 0; }

  @media (hover: hover) and (pointer: fine) {
    .pill:hover, .icon-btn:hover { border-color: var(--muted); }
  }
</style>
</head>
<body>
<div class="unlock" id="unlock">
  <h1 style="margin:0">Voice bridge</h1>
  <p>Tap once so this page is allowed to speak. Keep it open and the screen on to hear Claude.</p>
  <button id="unlockBtn">Start</button>
</div>

<header>
  <h1><span class="dot" id="dot"></span>Voice bridge</h1>
  <button class="icon-btn" id="statusAll">Status: all</button>
  <button class="icon-btn" id="sound">🔊 On</button>
</header>

<main>
  <section id="qSec" hidden>
    <h2>Waiting for you</h2>
    <div id="questions"></div>
  </section>
  <h2>Sessions</h2>
  <div id="sessions"><div class="empty">No Claude sessions yet. Start <code>claude</code> on your Mac.</div></div>
  <h2>Recent</h2>
  <div class="feed" id="feed"><div class="empty">Nothing yet.</div></div>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="target" id="target">No one to reply to yet</div>
    <form class="row" id="form">
      <input id="input" placeholder="Type a reply" autocomplete="off" enterkeyhint="send">
      <button class="send" type="submit">Send</button>
    </form>
    <button class="talk" id="talk">Hold to talk</button>
    <div class="bar-small">
      <label><input type="checkbox" id="autoSend"> Send voice right away</label>
      <select id="lang" aria-label="Speech language">
        <option value="en-US">English</option>
        <option value="ru-RU">Русский</option>
        <option value="uz-UZ">Oʻzbekcha</option>
      </select>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("vb." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("vb." + k, JSON.stringify(v)); } catch {} },
  };

  let sessions = [], questions = [], feed = [];
  let picked = null;            // {kind:"answer", qid} | {kind:"instruct", sid} chosen by tapping
  let soundOn = store.get("sound", true);
  const spoken = new Set();

  // ---------- toast ----------
  let toastTimer;
  function toast(msg, err = false, ms = 2200) {
    const t = $("toast");
    t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), ms);
  }

  async function post(path, body) {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || "Request failed");
      return data;
    } catch (e) { toast(e.message || "Couldn't reach the hub", true); throw e; }
  }

  // ---------- speech out ----------
  function speak(text) {
    if (!soundOn || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    speechSynthesis.speak(u);
  }
  function renderSound() { $("sound").textContent = soundOn ? "🔊 On" : "🔇 Off"; $("sound").classList.toggle("off", !soundOn); }
  $("sound").onclick = () => { soundOn = !soundOn; store.set("sound", soundOn); if (!soundOn) speechSynthesis.cancel(); renderSound(); };
  renderSound();

  $("unlockBtn").onclick = () => {
    try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch {}
    $("unlock").remove();
  };

  // ---------- target ----------
  function currentTarget() {
    if (picked?.kind === "answer" && questions.some((q) => q.qid === picked.qid)) return picked;
    if (picked?.kind === "instruct" && sessions.some((s) => s.id === picked.sid && s.state !== "ended")) {
      // An open question from the same session beats a plain message to it.
      const q = questions.find((q) => q.sid === picked.sid);
      return q ? { kind: "answer", qid: q.qid } : picked;
    }
    if (questions.length) return { kind: "answer", qid: questions[0].qid };
    const s = sessions.find((s) => s.state !== "ended");
    return s ? { kind: "instruct", sid: s.id } : null;
  }
  const label = (sid) => sessions.find((s) => s.id === sid)?.label || "session";

  function renderTarget() {
    const t = currentTarget(), el = $("target");
    if (!t) { el.textContent = "No one to reply to yet"; return; }
    if (t.kind === "answer") {
      const q = questions.find((q) => q.qid === t.qid);
      el.innerHTML = `Answering <b>${esc(label(q.sid))}</b>: ${esc(q.text)}`;
    } else {
      el.innerHTML = `Message to <b>${esc(label(t.sid))}</b>`;
    }
  }

  async function send(text) {
    text = text.trim();
    const t = currentTarget();
    if (!text) return;
    if (!t) { toast("No session to send to", true); return; }
    const res = t.kind === "answer"
      ? await post("/api/answer", { qid: t.qid, text })
      : await post("/api/instruct", { id: t.sid, text });
    picked = null;
    $("input").value = "";
    if (t.kind === "answer") toast("Answer sent");
    else if (res.delivery === "queued_idle") toast("Queued: Claude had already stopped, so it reads this at your next terminal prompt. Phone mode is on from then.", false, 6000);
    else if (res.delivery === "now") toast("Sent: Claude is picking it up");
    else toast("Sent: Claude gets it on its next step");
  }
  $("form").onsubmit = (e) => { e.preventDefault(); send($("input").value).catch(() => {}); };

  // ---------- render ----------
  const stateText = { working: "working", waiting: "needs answer", needs_terminal: "at terminal", idle: "idle", ended: "ended" };
  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; return Math.floor(s / 3600) + "h ago";
  }
  function clock(ts) { return new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

  function render() {
    const t = currentTarget();
    $("qSec").hidden = !questions.length;
    $("questions").innerHTML = questions.map((q) => `
      <button class="card q ${t?.qid === q.qid ? "sel" : ""}" data-qid="${q.qid}">
        <div class="who">${esc(label(q.sid))} · ${ago(q.ts)}</div>
        <div class="text">${esc(q.text)}</div>
      </button>`).join("");

    $("sessions").innerHTML = sessions.length ? sessions.map((s) => {
      const sel = t?.kind === "instruct" && t.sid === s.id;
      const waiting = s.phone_waiting_until ? `<div class="s-meta">Listening for your instructions until ${clock(s.phone_waiting_until)}</div>` : "";
      const queued = s.queued ? `<div class="s-meta">${s.queued} message(s) queued</div>` : "";
      const actions = s.state === "ended"
        ? `<button class="pill" data-forget="${s.id}">Remove</button>`
        : `<button class="pill" data-status="${s.id}">Status</button>
           <button class="pill" data-msg="${s.id}">Message</button>
           <button class="pill ${s.phone_mode ? "on" : ""}" data-phone="${s.id}">Phone mode ${s.phone_mode ? "on" : "off"}</button>`;
      return `<div class="card ${sel ? "sel" : ""} ${s.state === "ended" ? "ended" : ""}">
        <div class="s-top">
          <button class="s-label" data-rename="${s.id}" title="Rename">${esc(s.label)}</button>
          <span class="chip ${s.state}">${stateText[s.state] || s.state}</span>
        </div>
        ${s.last ? `<div class="s-last">${esc(s.last)}</div>` : ""}
        ${waiting}${queued}
        <div class="s-meta">${esc(s.cwd)}${s.claude_session_id ? ` · resume: claude --resume ${esc(s.claude_session_id)}` : ""}</div>
        <div class="s-actions">${actions}</div>
      </div>`;
    }).join("") : `<div class="empty">No Claude sessions yet. Start <code>claude</code> on your Mac.</div>`;

    const shown = feed.slice(-60).reverse();
    $("feed").innerHTML = shown.length ? shown.map((m) => `
      <div class="m ${m.kind}">
        <div class="who">${esc(m.label || "hub")} · ${clock(m.ts)} · ${m.kind === "answer" || m.kind === "instruction" ? "you" : m.kind}</div>
        ${esc(m.text)}
      </div>`).join("") : `<div class="empty">Nothing yet.</div>`;

    renderTarget();
    document.title = questions.length ? `(${questions.length}) Voice bridge` : "Voice bridge";
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    try {
      if (d.qid) { picked = { kind: "answer", qid: d.qid }; render(); $("input").focus({ preventScroll: true }); }
      else if (d.msg) { picked = { kind: "instruct", sid: d.msg }; render(); }
      else if (d.status) { await post("/api/status", { id: d.status }); toast("Status requested"); }
      else if (d.phone) {
        const s = sessions.find((x) => x.id === d.phone);
        await post("/api/phone_mode", { id: d.phone, on: !s.phone_mode });
        toast(!s.phone_mode ? "Phone mode on: Claude will wait for you when it finishes" : "Phone mode off");
      }
      else if (d.rename) {
        const s = sessions.find((x) => x.id === d.rename);
        const name = prompt("Name this session", s?.label || "");
        if (name && name.trim()) { await post("/api/label", { id: d.rename, label: name }); toast("Renamed"); }
      }
      else if (d.forget) { await post("/api/forget", { id: d.forget }); }
    } catch {}
  });
  $("statusAll").onclick = () => post("/api/status", { id: "all" }).then(() => toast("Status requested from all")).catch(() => {});

  // ---------- live updates ----------
  function onMessage(m) {
    if (feed.some((x) => x.id === m.id)) return;
    feed.push(m); if (feed.length > 300) feed.shift();
    if (m.replay || !m.speak || spoken.has(m.id)) return;
    spoken.add(m.id);
    const who = m.label ? m.label.replace(" · ", ", ") : "Voice bridge";
    if (m.kind === "question") { speak(`${who} asks: ${m.text}`); navigator.vibrate?.([120, 80, 120]); }
    else speak(`${who}: ${m.text}`);
  }

  function connect() {
    const es = new EventSource("/events");
    es.onopen = () => $("dot").classList.add("on");
    es.onerror = () => $("dot").classList.remove("on");
    es.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "state") { sessions = data.sessions; questions = data.questions; }
      else if (data.type === "message") onMessage(data);
      render();
    };
  }
  connect();
  setInterval(render, 30000); // keep "Xm ago" fresh

  // ---------- speech in ----------
  const autoSend = $("autoSend"), lang = $("lang"), talk = $("talk");
  autoSend.checked = store.get("autoSend", true);
  autoSend.onchange = () => store.set("autoSend", autoSend.checked);
  lang.value = store.get("lang", "en-US");
  lang.onchange = () => store.set("lang", lang.value);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!window.isSecureContext) { talk.disabled = true; talk.textContent = "Voice needs HTTPS (use tailscale serve)"; }
  else if (!SR) { talk.disabled = true; talk.textContent = "Voice input not supported here"; }

  let rec = null, finalText = "", holding = false;
  function startRec() {
    if (!SR || rec) return;
    speechSynthesis.cancel();
    finalText = "";
    rec = new SR();
    rec.lang = lang.value; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = "";
      finalText = "";
      for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript));
      $("input").value = (finalText + interim).trim();
    };
    rec.onerror = (e) => { if (e.error !== "aborted" && e.error !== "no-speech") toast("Mic: " + e.error, true); };
    rec.onend = () => {
      rec = null; talk.classList.remove("rec"); talk.textContent = "Hold to talk";
      const text = $("input").value.trim();
      if (text && autoSend.checked) send(text).catch(() => {});
    };
    try { rec.start(); talk.classList.add("rec"); talk.textContent = "Listening… release to stop"; }
    catch { rec = null; }
  }
  function stopRec() { holding = false; if (rec) rec.stop(); }

  talk.addEventListener("pointerdown", (e) => { e.preventDefault(); holding = true; talk.setPointerCapture?.(e.pointerId); startRec(); });
  talk.addEventListener("pointerup", stopRec);
  talk.addEventListener("pointercancel", stopRec);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());
})();
</script>
</body>
</html>
