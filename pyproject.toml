[project]
name = "voice-bridge"
version = "0.1.0"
description = "Talk to your Claude Code sessions from your phone: spoken updates, voice answers, many sessions at once."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
]

[project.scripts]
vb-hub = "voice_bridge.hub:main"
vb-mcp = "voice_bridge.helper:main"
vb-hook = "voice_bridge.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
